
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.chat-container{
    width:90%;
    max-width:700px;
    height:80vh;
    background:white;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0078ff;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#chat{
    flex:1;
    padding:15px;
    overflow-y:auto;
    background:#f7f7f7;
}

.message{
    max-width:75%;
    padding:10px 15px;
    margin:10px 0;
    border-radius:15px;
}

.user{
    background:#0078ff;
    color:white;
    margin-left:auto;
}

.ai{
    background:#e5e5ea;
    color:black;
}

.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    margin-left:10px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#0078ff;
    color:white;
}

.dark{
    background:#121212;
}

.dark .chat-container{
    background:#1e1e1e;
}

.dark #chat{
    background:#181818;
}

.dark .ai{
    background:#333;
    color:white;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">
    AI Assistant
    <button onclick="toggleDark()">🌙</button>
</div>

<div id="chat">
    <div class="message ai">
        Hello! Ask me anything.
    </div>
</div>

<div class="input-area">
    <input id="question" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
</div>

</div>

<script>
function sendMessage(){

let input=document.getElementById("question");
let text=input.value.trim();

if(text==="") return;

let chat=document.getElementById("chat");

chat.innerHTML +=
'<div class="message user">'+text+'</div>';

let reply="I am still learning.";

let q=text.toLowerCase();

if(q.includes("hello"))
reply="Hello! Nice to meet you.";

else if(q.includes("who are you"))
reply="I am your AI Assistant.";

else if(q.includes("ai"))
reply="AI stands for Artificial Intelligence.";

else if(q.includes("bye"))
reply="Goodbye!";

chat.innerHTML +=
'<div class="message ai">'+reply+'</div>';

input.value="";
chat.scrollTop=chat.scrollHeight;
}

document.getElementById("question")
.addEventListener("keypress",function(event){
if(event.key==="Enter"){
sendMessage();
}
});

function toggleDark(){
document.body.classList.toggle("dark");
}
</script>

</body>
</html>
