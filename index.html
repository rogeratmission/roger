
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.chat-container{
    width:90%;
    max-width:700px;
    height:80vh;
    background:white;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0078ff;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#chat{
    flex:1;
    padding:15px;
    overflow-y:auto;
    background:#f7f7f7;
}

.message{
    max-width:75%;
    padding:10px 15px;
    margin:10px 0;
    border-radius:15px;
}

.user{
    background:#0078ff;
    color:white;
    margin-left:auto;
}

.ai{
    background:#e5e5ea;
    color:black;
}

.input-area{
    display:flex;
    padding:10px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    margin-left:10px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#0078ff;
    color:white;
}

.dark{
    background:#121212;
}

.dark .chat-container{
    background:#1e1e1e;
}

.dark #chat{
    background:#181818;
}

.dark .ai{
    background:#333;
    color:white;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">
    AI Assistant
    <button onclick="toggleDark()">🌙</button>
</div>

<div id="chat">
    <div class="message ai">
        Hello! Ask me anything.
    </div>
</div>

<div class="input-area">
    <input id="question" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
</div>

</div>
<script>

const jokes = [
    "Why did the programmer quit his job? Because he didn't get arrays.",
    "Why do Java developers wear glasses? Because they can't C#.",
    "Why was the computer cold? It left its Windows open."
];

loadChat();

function sendMessage() {

    let input = document.getElementById("question");
    let text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");

    let reply = getResponse(text);

    setTimeout(() => {
        addMessage(reply, "ai");
        saveChat();
    }, 300);

    input.value = "";
}

function getResponse(text) {

    let q = text.toLowerCase();

    if (q.includes("hello") || q.includes("hi"))
        return "Hello! How can I help you today?";

    if (q.includes("who are you"))
        return "I am your AI Assistant.";

    if (q.includes("time"))
        return "Current time: " + new Date().toLocaleTimeString();

    if (q.includes("date"))
        return "Today's date: " + new Date().toLocaleDateString();

    if (q.includes("joke"))
        return jokes[Math.floor(Math.random() * jokes.length)];

    if (q.includes("bye"))
        return "Goodbye!";

    let math = text.match(/^(\d+)\s*([\+\-\*\/])\s*(\d+)$/);

    if (math) {

        let a = Number(math[1]);
        let op = math[2];
        let b = Number(math[3]);

        if (op === "+") return "Answer: " + (a + b);
        if (op === "-") return "Answer: " + (a - b);
        if (op === "*") return "Answer: " + (a * b);
        if (op === "/") return "Answer: " + (a / b);
    }

    const facts = {
        "what is ai":
            "AI stands for Artificial Intelligence.",
        "what is earth":
            "Earth is the third planet from the Sun.",
        "what is water":
            "Water is H₂O, a molecule made of hydrogen and oxygen.",
        "what is github":
            "GitHub is a platform used to store and manage code."
    };

    if (facts[q]) return facts[q];

    return "I don't know that yet. Teach me by adding more facts to my code!";
}

function addMessage(text, type) {

    let chat = document.getElementById("chat");

    chat.innerHTML +=
        `<div class="message ${type}">${text}</div>`;

    chat.scrollTop = chat.scrollHeight;
}

function saveChat() {
    localStorage.setItem(
        "chatHistory",
        document.getElementById("chat").innerHTML
    );
}

function loadChat() {

    let saved =
        localStorage.getItem("chatHistory");

    if (saved) {
        document.getElementById("chat").innerHTML =
            saved;
    }
}

document
.getElementById("question")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

function toggleDark() {
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
