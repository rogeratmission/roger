<!DOCTYPE html>
<html>
<head>
    <title>My AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-box {
            width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input {
            width: 75%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #0078ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005fd1;
        }

        #answer {
            margin-top: 20px;
            padding: 10px;
            background: #eef3ff;
            border-radius: 8px;
            min-height: 40px;
        }
    </style>
</head>

<body>

<div class="chat-box">
    <h1>AI Assistant</h1>

    <div id="chat" style="
        height:300px;
        overflow-y:auto;
        border:1px solid #ddd;
        border-radius:8px;
        padding:10px;
        margin-bottom:10px;">
    </div>

    <input type="text" id="question" placeholder="Ask anything...">
    <button onclick="answerQuestion()">Send</button>
</div>

<script>
function answerQuestion() {
    let q = document.getElementById("question").value;

    if(q.trim() === "") return;

    let chat = document.getElementById("chat");

    chat.innerHTML +=
        "<p><b>You:</b> " + q + "</p>";

    chat.innerHTML +=
        "<p><b>AI:</b> I received your message.</p>";

    document.getElementById("question").value = "";

    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("question")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        answerQuestion();
    }
});
</script>
    </body>
</html>
